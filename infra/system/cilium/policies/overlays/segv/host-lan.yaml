apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-lan
spec:
  description: Allow management access to nodes from the LAN.
  nodeSelector: {}
  ingress:
  - fromCIDR: # FIXME: Restrict to admin VLAN.
    - 10.0.0.0/16
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
      - port: "6443"
        protocol: TCP
  - fromCIDR:
    - 10.0.0.0/16
    icmps:
    - fields:
      - type: EchoRequest
        family: IPv4
