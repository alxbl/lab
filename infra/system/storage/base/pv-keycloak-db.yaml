# Dataset data/k8s/keycloak-db, claimed by keycloak/keycloak-db-1 (CNPG instance PVC).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-db
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/keycloak-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: keycloak
    name: keycloak-db-1
