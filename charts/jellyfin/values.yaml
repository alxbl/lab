replicaCount: 1

image:
  repository: jellyfin/jellyfin
  pullPolicy: IfNotPresent
  # Overrides the image tag. Default is the chart appVersion.
  # tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "jellyfin-sa"

podAnnotations: {}
podLabels: {}

# No fsGroup: on a local PV kubelet would recursively chown the whole volume. Jellyfin runs as 1000.
podSecurityContext: {}

securityContext:
  #capabilities:
  #  drop:
  #  - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

jellyfin:
  JELLYFIN_CONFIG_DIR: /media/.config/jellyfin
  JELLYFIN_CACHE_DIR: /cache

storage:
  name: media-server-pvc
  create: false
  size: 1Gi
  storageClass: "zfs-rwx"
  accessMode: ReadWriteMany
  # Bind the claim to this pre-created PV (static local volume). Empty for dynamically provisioned volumes.
  volumeName: ""

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
