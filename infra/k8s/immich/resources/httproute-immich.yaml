# Immich cannot be served from a sub-path, so it gets its own hostname (covered by the *.segfault.me certificate).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
spec:
  parentRefs:
  - name: https-in-gw
    namespace: gateway
    sectionName: https
  hostnames:
  - photos.segfault.me
  rules:
  - backendRefs:
    - name: immich-server
      port: 2283
