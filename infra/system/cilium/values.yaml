# Shared Cilium Helm values. Cluster specifics are in values-<cluster>.yaml.
# Chart version is pinned in the Application (infra/system/catalog) and dev/up.sh.
k8sServicePort: 6443

kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
bpf:
  masquerade: true
  # LAN clients reach ClusterIPs through a static route to the node.
  lbExternalClusterIP: true
cni:
  exclusive: true

l7Proxy: true
envoy:
  enabled: true
gatewayAPI:
  enabled: true
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20
hostFirewall:
  enabled: true
encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  relay:
    enabled: true
  tls:
    auto:
      method: cronJob

# Single controller today.
operator:
  replicas: 1
