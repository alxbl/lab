# Dataset data/k8s/forgejo, claimed by code/forgejo (Forgejo repositories, LFS and attachments).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/forgejo
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: code
    name: forgejo
