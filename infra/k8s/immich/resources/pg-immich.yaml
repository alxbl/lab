# https://github.com/immich-app/immich-charts/blob/main/local/cloudnative-pg.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: immich
spec:
  instances: 1
  storage:
    size: 10Gi
    # Immich is not deployed (no catalog Application). Before re-enabling it, add a PV for this claim to infra/system/storage.
    storageClass: local-zfs

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18
  postgresql:
    shared_preload_libraries:
      - "vchord.so"