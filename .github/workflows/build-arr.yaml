name: "Build ARR images"

on:
  schedule:
    # Mondays 02:00 UTC, an hour after the FCOS build
    - cron: '00 02 * * 1'
  push:
    branches: [ "main" ]
    paths:
      - 'build/arr/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Upstream version of each app, taken from the pinned linuxserver tag
      # (e.g. 4.0.20.3014-ls329 -> 4.0.20.3014).
      - name: Resolve upstream versions
        id: ver
        run: |
          for app in sonarr radarr lidarr prowlarr; do
            tag=$(sed -nE "s#^FROM ghcr.io/linuxserver/${app}:([^ ]+).*#\1#p" "build/arr/${app}.Dockerfile")
            [ -n "$tag" ] || { echo "no pinned tag for ${app}" >&2; exit 1; }
            echo "${app}=${tag%-ls*}" >> "$GITHUB_OUTPUT"
          done

      # TODO: Parallelize?
      - name: Build Sonarr
        uses: ./.github/actions/build-and-sign
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ github.actor }}/sonarr
          dockerfile: build/arr/sonarr.Dockerfile
          context: build/arr
          version: ${{ steps.ver.outputs.sonarr }}
          
      - name: Build Radarr
        uses: ./.github/actions/build-and-sign
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ github.actor }}/radarr
          dockerfile: build/arr/radarr.Dockerfile
          context: build/arr
          version: ${{ steps.ver.outputs.radarr }}
      
      - name: Build Lidarr
        uses: ./.github/actions/build-and-sign
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ github.actor }}/lidarr
          dockerfile: build/arr/lidarr.Dockerfile
          context: build/arr
          version: ${{ steps.ver.outputs.lidarr }}

      - name: Build Prowlarr
        uses: ./.github/actions/build-and-sign
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ github.actor }}/prowlarr
          dockerfile: build/arr/prowlarr.Dockerfile
          context: build/arr
          version: ${{ steps.ver.outputs.prowlarr }}