apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cronjob.yaml
- rules.yaml
configMapGenerator:
- name: restore-test-script
  namespace: system
  files:
  - restore-test.sh
- name: grafana-dashboard-backups
  namespace: monitoring
  files:
  - backups.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
