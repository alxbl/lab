# Dataset data/k8s/forgejo-cache (quota 30G, context=none), claimed by code/forgejo-cache (the Actions cache shared by all
# runners). It has its own quota so a growing cache cannot starve the runners' state, which shares data/k8s/forgejo-runner.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo-cache
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/forgejo-cache
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: code
    name: forgejo-cache
