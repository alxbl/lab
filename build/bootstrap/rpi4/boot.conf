# Bootloader EEPROM configuration for Raspberry Pi 4 nodes.
# Built into pieeprom.upd by scripts/rpi-eeprom-build and applied over TFTP.
# Reference: https://www.raspberrypi.com/documentation/computers/raspberry-pi.html#raspberry-pi-4-bootloader-configuration
[all]
# Nibbles are read right to left: SD (1), USB (4), network (2), restart (f).
BOOT_ORDER=0xf241
# Per-node TFTP directory named after the MAC address instead of the serial.
TFTP_PREFIX=2
ENABLE_SELF_UPDATE=1
BOOT_UART=1
