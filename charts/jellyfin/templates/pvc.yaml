{{- if and .Values.storage.create (not .Values.storage.hostPath) -}}
{{- with .Values.storage -}}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ .name | quote }}
spec:
  storageClassName: {{ .storageClass | default "" | quote }}
  {{- with .volumeName }}
  volumeName: {{ . | quote }}
  {{- end }}
  accessModes:
    - {{ .accessMode | default "ReadWriteMany" | quote }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}
{{- end }}