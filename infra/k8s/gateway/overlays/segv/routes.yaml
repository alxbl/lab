# FIXME: Routes should be owned by the application when it gets deployed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-root
  namespace: gateway
spec:
  parentRefs:
  - name: https-in-gw
    sectionName: https
  hostnames:
  - lab.segfault.me
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /watch
        statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
  - name: https-in-gw
    namespace: gateway
    sectionName: https
  hostnames:
  - lab.segfault.me
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /watch
    backendRefs:
    - name: jellyfin
      port: 80
---
