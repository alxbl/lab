# Shared Cilium Helm values. Cluster specifics are in values-<cluster>.yaml.
# Chart version is pinned in the Application (infra/system/catalog) and dev/up.sh.
k8sServicePort: 6443

kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
bpf:
  masquerade: true
  # LAN clients reach ClusterIPs through a static route to the node.
  lbExternalClusterIP: true
cni:
  exclusive: true

# Enforces the kubernetes.io/egress-bandwidth pod annotation (used by velero).
bandwidthManager:
  enabled: true

l7Proxy: true
gatewayAPI:
  enabled: true
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20
hostFirewall:
  enabled: true
encryption:
  enabled: true
  type: wireguard

hubble:
  enabled: true
  relay:
    enabled: true
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - icmp
  tls:
    auto:
      method: cronJob

# Metrics are scraped by the PodMonitors in infra/system/cilium/monitoring. The chart's own ServiceMonitors are
# not used: they need the Prometheus CRDs, which do not exist when install-cilium.sh runs.
prometheus:
  enabled: true
envoy:
  enabled: true
  prometheus:
    enabled: true

# Single controller today.
operator:
  replicas: 1
  prometheus:
    enabled: true
