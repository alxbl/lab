apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default

  source:
    chart: velero
    repoURL: https://vmware-tanzu.github.io/helm-charts
    targetRevision: 6.0.0
    helm:
      valuesObject:
        # https://github.com/vmware-tanzu/helm-charts/blob/main/charts/velero/values.yaml
        # The CRD upgrade hook defaults to bitnami/kubectl:<cluster minor>, which no longer exists. The hook copies sh and
        # kubectl into the velero image, so the replacement must be a glibc image with a shell (not alpine or distroless).
        kubectl:
          image:
            repository: docker.io/bitnamilegacy/kubectl
            tag: "1.33"

        initContainers:
          - name: velero-plugin-for-microsoft-azure
            image: velero/velero-plugin-for-microsoft-azure:v1.9.2
            immagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins

        configuration:
          backupStorageLocation: []
          volumeSnapshotLocation: []
          uploaderType: kopia
          backupSyncPeriod: 15m
          fsBackupTimeout: 4h
          clientBurst: 30
          clientPageSize: 500
          clientQPS: 20.0
          defaultBackupStorageLocation: azure
          garbageCollectionFrequency: 24h
          logLevel: warning
          defaultSnapshotMoveData: false
          namespace: system
          # defaultRepoMaintainFrequency: 

        backupsEnabled: false
        snapshotsEnabled: false
        deployNodeAgent: true

        schedules: {}
        configMaps: {}

        nodeAgent:
          containerSecurityContext:
            privileged: true
          # Quantities are written in canonical form (1, 1Gi) so the rendered manifest matches what the API server stores.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

        credentials:
          useSecret: true
          existingSecret: velero-azure-storage-key
        serviceAccount:
          server:
            name: "velero"
        resources:
          requests:
            cpu: 500m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 4Gi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: system
