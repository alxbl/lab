apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aquisition
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: media
  project: default
  source:
    helm:
      valuesObject:
        qbt:
          maxSeedTime: 20400
          uploadLimit: 10000
          downloadLimit: 10000
        storage:
          create: 'true'
          size: 1Ti
        vpn:
          mode: "wireguard"
          provider: "protonvpn"
          countries: "Switzerland"
          dns_over_vpn: 'true'
          extra:
            PORT_FORWARD_ONLY: "on"
            VPN_PORT_FORWARDING: "on"
            # Probe by IP: the startup healthcheck races gluetun's DNS server and restarts the VPN in a loop.
            HEALTH_TARGET_ADDRESSES: "1.1.1.1:443,8.8.8.8:443"
    path: charts/aquisition
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
