apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
  # Gateway and smbd VIP. The LAN routes 10.3.0.0/16 to the node, L2 announcement is unnecessary.
  - cidr: 10.3.0.2/32
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  interfaces:
  - ^eno1$
  loadBalancerIPs: true
