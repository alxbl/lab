# Dataset data/k8s/vaultwarden, claimed by home/vaultwarden-data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: vaultwarden
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/vaultwarden
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: home
    name: vaultwarden-data
