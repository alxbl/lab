# Dataset data/k8s/firefly-db, claimed by home/firefly-database-1 (CNPG instance PVC).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: firefly-db
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/firefly-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: home
    name: firefly-database-1
