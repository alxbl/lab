# Simple service to test routing.
services:
  # Dashboards
  grafana:
    image: docker.io/grafana/grafana-enterprise
    networks:
      - traefik
    command:
      - "--config"
      - "/conf/grafana.ini"
    ports:
      - 3000:3000
    volumes:
      - grafana:/var/lib/grafana:rw
      - ./grafana.ini:/conf/grafana.ini:ro,z

  # Collector
  otelcol:
    image: docker.io/otel/opentelemetry-collector
    networks: 
      - traefik
    volumes:
      - ./otel.yaml:/etc/otelcol/config.yaml:ro,z
      - ../certbot/etc:/etc/letsencrypt:ro,z
    ports:
      # - 1888:1888 # pprof extension
      # - 8880:8888 # Prometheus metrics exposed by the Collector
      # - 8889:8889 # Prometheus exporter metrics
      # - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      # - 4318:4318 # OTLP http receiver
      # - 55679:55679 # zpages extension
  
  # Metrics
  prometheus:
    image: docker.io/prom/prometheus
    networks:
      - traefik
    command:
      - "--web.enable-otlp-receiver"
      - "--web.enable-remote-write-receiver"
      - "--config.file"
      - "/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus:/prometheus

  # Logs
  loki:
    image: docker.io/grafana/loki
    networks:
      - traefik
    command:
      - "-config.file"
      - "/etc/loki.yaml"
    volumes:
      - ./loki.yaml:/etc/loki.yaml:ro,z
  # Traces
  zipkin:
    image: ghcr.io/openzipkin/zipkin-slim:${ZIPKIN_TAG:-latest}
    # Environment settings are defined here https://github.com/openzipkin/zipkin/blob/master/zipkin-server/README.md#environment-variables
    environment:
      - STORAGE_TYPE=mem
      # Uncomment to enable self-tracing
      - SELF_TRACING_ENABLED=true
      # Uncomment to increase heap size
      # - JAVA_OPTS=-Xms128m -Xmx128m -XX:+ExitOnOutOfMemoryError
    ports:
      # Port used for the Zipkin UI and HTTP Api
      - 9411:9411
volumes:
  prometheus:
  grafana:
networks:
  traefik:
    name: traefik