# https://github.com/aeger/traefik-rootless
services:
  traefik:
    image: docker.io/traefik:v3.7
    security_opt:
      - label=type:container_runtime_t
    ports:
      - "80:80"
      - "8080:8080"
    cap_add:
      - NET_BIND_SERVICE
    networks: 
     - traefik
    volumes:
      - /var/run/podman/podman.sock:/var/run/docker.sock:z
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro

networks:
  traefik:
    name: traefik