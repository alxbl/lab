# LoadBalancer IPs on the LAN, announced over ARP by the node.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan
spec:
  blocks:
  - start: 10.2.0.200
    stop: 10.2.0.209
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan
spec:
  interfaces:
  - ^enp1s0$
  loadBalancerIPs: true
