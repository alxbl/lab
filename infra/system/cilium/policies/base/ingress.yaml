# Source allow-list for the Gateway (replaces the allow-istio-gateway NetworkPolicy).
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: gateway-allow-sources
spec:
  description: Only LAN, VPN and Cloudflare may reach the Cilium gateway proxy on 80/443.
  endpointSelector:
    matchLabels:
      reserved:ingress: ""
  ingress:
  - fromCIDR:
    - 10.0.0.0/8         # LAN
    - 192.168.2.0/24     # VPN
    - 127.0.0.0/16       # Loopback
    # https://www.cloudflare.com/ips-v4/
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 172.177.238.119/32 # segv-www
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
      - port: "443"
        protocol: TCP
