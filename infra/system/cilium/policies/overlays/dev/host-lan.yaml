apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-allow-lan
spec:
  description: Allow management access to nodes from the LAN.
  nodeSelector: {}
  ingress:
  - fromCIDR:
    - 10.2.0.0/24
    toPorts:
    - ports:
      - port: "22"
        protocol: TCP
      - port: "6443"
        protocol: TCP
  - fromCIDR:
    - 10.2.0.0/24
    icmps:
    - fields:
      - type: EchoRequest
        family: IPv4
