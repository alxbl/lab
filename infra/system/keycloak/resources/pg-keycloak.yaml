apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: local-zfs
    # Binds the instance PVC (keycloak-db-1) to the static PV in infra/system/storage.
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-zfs
      volumeName: keycloak-db
      resources:
        requests:
          storage: 10Gi
