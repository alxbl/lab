# Dataset data/k8s/forgejo-runner, claimed by code/forgejo-runner (runner registration state, one subdirectory per pod).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgejo-runner
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/forgejo-runner
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: code
    name: forgejo-runner
