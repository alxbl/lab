# Weekly restore test of a Velero backup, with its metrics rules and the backup dashboard (infra/system/restore-test).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: restore-test
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: system
  project: system
  source:
    path: infra/system/restore-test
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
