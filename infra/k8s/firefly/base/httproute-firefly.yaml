# Firefly cannot be served from a sub-path, so it gets its own hostname (covered by the *.segfault.me certificate).
# LAN only: the record exists in AdGuard and on the UDM, not in Cloudflare.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: firefly
spec:
  parentRefs:
  - name: https-in-gw
    namespace: gateway
    sectionName: https
  hostnames:
  - money.segfault.me
  rules:
  - backendRefs:
    - name: firefly
      port: 4180
