# https://github.com/immich-app/immich-charts/blob/main/local/cloudnative-pg.yaml
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-database
  namespace: media
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: local-zfs
    # Binds the instance PVC (immich-database-1) to the static PV in infra/system/storage.
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-zfs
      volumeName: immich-db
      resources:
        requests:
          storage: 10Gi

  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
