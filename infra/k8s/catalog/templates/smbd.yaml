apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smbd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: media
  project: default
  source:
    helm:
      valuesObject:
        service:
          type: LoadBalancer
          # PLACEHOLDER: the user picks the LAN IP at cutover (must be inside the CiliumLoadBalancerIPPool).
          loadBalancerIP: 10.0.0.81
        allowedCIDRs:
          - 10.0.0.0/8
          - 192.168.2.0/24
        storage:
          create: true
          size: 1Ti
          storageClass: 'zfs-rwx'
          accessMode: ReadWriteMany
    path: charts/smbd
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
