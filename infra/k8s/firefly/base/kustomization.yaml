apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home
resources:
- pg-firefly.yaml
- cnp-cnpg.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- netpol-isolate.yaml
- httproute-firefly.yaml
- cronjob.yaml
# Firefly has no native OIDC: an oauth2-proxy sidecar (infra/k8s/oauth2-proxy) logs users in through Keycloak.
components:
- ../../oauth2-proxy
configMapGenerator:
- name: oauth2-proxy-params
  options:
    disableNameSuffixHash: true
  literals:
  - client-id=firefly
  - secret-name=firefly-oauth2-proxy
  - upstream=http://127.0.0.1:8080
  - redirect-url=https://money.segfault.me/oauth2/callback
