apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-database
spec:
  instances: 1
  # Velero (infra/system/velero) copies the volume with kopia; a copy of a live data directory is not reliable, so the
  # pre-hook leaves a logical dump next to it. Restore from backup/app.dump with pg_restore.
  inheritedMetadata:
    annotations:
      backup.velero.io/backup-volumes: pgdata
      pre.hook.backup.velero.io/container: postgres
      pre.hook.backup.velero.io/command: '["/bin/bash", "-c", "mkdir -p /var/lib/postgresql/data/backup && pg_dump -Fc -d app -f /var/lib/postgresql/data/backup/app.dump"]'
      pre.hook.backup.velero.io/on-error: Fail
      pre.hook.backup.velero.io/timeout: 5m
  storage:
    size: 10Gi
    storageClass: local-zfs
    # Binds the instance PVC (forgejo-database-1) to the static PV in infra/system/storage.
    pvcTemplate:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-zfs
      volumeName: forgejo-db
      resources:
        requests:
          storage: 10Gi
