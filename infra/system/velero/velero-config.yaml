apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-policy-zfs
  namespace: system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  skipped.yaml: |
    version: v1
    volumePolicies:
    - conditions:
        nfs: {}
      action:
        type: skip
    - conditions:
        volumeTypes:
          - emptyDir
          - downwardAPI
          - configmap
      action:
        type: skip