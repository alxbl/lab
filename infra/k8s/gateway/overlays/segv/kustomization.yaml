apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ../../routes
- routes.yaml
patches:
- target:
    kind: Gateway
    name: https-in-gw
  patch: |-
    - op: add
      path: /spec/infrastructure
      value:
        annotations:
          # Inside the service CIDR, which the LAN routes to the node.
          lbipam.cilium.io/ips: 10.3.0.2
          lbipam.cilium.io/sharing-key: gateway-vip
          lbipam.cilium.io/sharing-cross-namespace: media,code
