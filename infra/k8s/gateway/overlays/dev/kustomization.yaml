apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ../../routes
- issuer.yaml
- httpbin-route.yaml
patches:
- target:
    kind: Certificate
    name: https-in-gw-cert
  patch: |-
    - op: replace
      path: /spec/issuerRef/name
      value: selfsigned-issuer
- target:
    kind: Gateway
    name: https-in-gw
  patch: |-
    - op: add
      path: /spec/infrastructure
      value:
        annotations:
          lbipam.cilium.io/ips: 10.2.0.200
