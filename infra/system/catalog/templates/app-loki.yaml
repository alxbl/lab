# Log storage. Single binary on a static local-zfs PV (infra/system/storage), queried from Grafana.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: system
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring
  source:
    chart: loki
    repoURL: https://grafana-community.github.io/helm-charts
    targetRevision: 19.1.1
    helm:
      valuesObject:
        # https://github.com/grafana-community/helm-charts/blob/main/charts/loki/values.yaml
        deploymentMode: Monolithic
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
            - from: "2026-10-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
          limits_config:
            retention_period: 720h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false
        singleBinary:
          replicas: 1
          # Pre-bound to PV loki (infra/system/storage).
          persistence:
            enabled: true
            size: 20Gi
            storageClass: local-zfs
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        gateway:
          enabled: false
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false
        sidecar:
          rules:
            enabled: false
