{{- if .Values.service.create -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smbd.name" . }}
  labels:
    {{- include "smbd.labels" . | nindent 4 }}
  {{- if or .Values.service.loadBalancerIP .Values.service.annotations }}
  annotations:
    {{- if .Values.service.loadBalancerIP }}
    lbipam.cilium.io/ips: {{ .Values.service.loadBalancerIP | quote }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 445
      targetPort: 445
      protocol: TCP
      name: smb
  selector:
    {{- include "smbd.selectorLabels" . | nindent 4 }}
{{- end }}