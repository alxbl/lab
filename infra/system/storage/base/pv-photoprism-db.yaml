# Dataset data/k8s/photoprism-db, claimed by media/photoprism-cache. Kept as a backup of the retired PhotoPrism library
# (MariaDB + cache); the app is gone and the dataset quota is 27G, below the 50Gi declared here.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photoprism-db
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/photoprism-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: media
    name: photoprism-cache
