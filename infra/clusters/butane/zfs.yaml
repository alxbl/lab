# ZFS support for stock Fedora CoreOS: rebases onto the ZFS image once, before sshd starts, then imports pools.
# The image reference is the literal @ZFS_IMAGE@ (a pinned digest): replace it before rendering, e.g. with
# Terraform replace(file("../butane/zfs.yaml"), "@ZFS_IMAGE@", var.zfs_image).
variant: fcos
version: 1.5.0
systemd:
  units:
    - name: zincati.service
      mask: true
    - name: zfs-rebase.service
      enabled: true
      contents: |
        [Unit]
        Description=Rebase onto the ZFS image
        ConditionPathExists=!/var/lib/zfs-rebased
        Wants=network-online.target
        After=network-online.target
        Before=sshd.service

        [Service]
        Type=oneshot
        ExecStart=/usr/bin/rpm-ostree rebase ostree-unverified-registry:@ZFS_IMAGE@
        ExecStart=/usr/bin/touch /var/lib/zfs-rebased
        ExecStart=/usr/bin/systemctl reboot

        [Install]
        WantedBy=multi-user.target
    - name: zfs-import.target
      enabled: true
    - name: zfs-mount.service
      enabled: true
    - name: zfs.target
      enabled: true
storage:
  links:
    # The image's preset disables zfs-import-scan, and the preset applied by the rebase wins over Ignition's `enabled`.
    - path: /etc/systemd/system/zfs-import.target.wants/zfs-import-scan.service
      target: /usr/lib/systemd/system/zfs-import-scan.service
  files:
    # The kubelet runs in a podman container that only sees a fixed set of host paths; local PVs live under /var/data.
    # rslave: ZFS mounts made later on the host show up in the container; container-side mounts do not leak back (rshared would).
    # Applies to every podman container created afterwards; restart only the kubelet (systemctl restart kubelet), not the node.
    - path: /etc/containers/containers.conf.d/10-data.conf
      contents:
        inline: |
          [containers]
          volumes = ["/var/data:/var/data:rslave"]
