# Forgejo gets its own hostname (covered by the *.segfault.me certificate).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
spec:
  parentRefs:
  - name: https-in-gw
    namespace: gateway
    sectionName: https
  hostnames:
  - code.segfault.me
  rules:
  - backendRefs:
    - name: forgejo-http
      port: 3000
