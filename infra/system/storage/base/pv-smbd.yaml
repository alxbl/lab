# Dataset data/k8s/smbd, claimed by media/smbd-data.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: smbd
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/smbd
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: media
    name: smbd-data
