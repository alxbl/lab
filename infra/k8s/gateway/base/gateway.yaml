# LoadBalancer IP comes from CiliumLoadBalancerIPPool (infra/system/cilium/policies).
#  Cluster overlays dictate the final IP.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-in-gw
  namespace: gateway
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - name: https-in-gw-tls
    allowedRoutes:
      namespaces:
        from: All
