# Dedicated NVMe disk for etcd and containerd, so the OS disk (USB) only boots. Both are wiped on every reprovision, like the root
# filesystem: Typhoon bootstraps a fresh etcd with new certificates (stale data would conflict) and containerd re-pulls its images. The literal @ETCD_DISK@ is a /dev/disk/by-id path (never /dev/nvmeXn1), replaced
# before rendering, e.g. with Terraform replace(file("../butane/etcd-disk.yaml"), "@ETCD_DISK@", var.etcd_disk).
variant: fcos
version: 1.5.0
storage:
  disks:
    - device: "@ETCD_DISK@"
      wipe_table: true
      partitions:
        - label: etcd
          number: 1
          size_mib: 32768
        - label: containerd
          number: 2
  filesystems:
    - device: /dev/disk/by-partlabel/etcd
      format: xfs
      wipe_filesystem: true
      label: etcd
      path: /var/lib/etcd
      with_mount_unit: true
    - device: /dev/disk/by-partlabel/containerd
      format: xfs
      wipe_filesystem: true
      label: containerd
      path: /var/lib/containerd
      with_mount_unit: true
systemd:
  units:
    - name: etcd-member.service
      dropins:
        - name: 10-mount.conf
          contents: |
            [Unit]
            RequiresMountsFor=/var/lib/etcd
    - name: containerd.service
      dropins:
        - name: 10-mount.conf
          contents: |
            [Unit]
            RequiresMountsFor=/var/lib/containerd
