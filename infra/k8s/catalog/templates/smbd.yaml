apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smbd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: media
  project: default
  source:
    helm:
      valuesObject:
        podAnnotations:
          # kopia backs up this volume from the pod (it was only annotated on the live NFS server pod before).
          backup.velero.io/backup-volumes: storage
        service:
          type: LoadBalancer
          # Shared with cilium gateway.
          loadBalancerIP: 10.3.0.2
          annotations:
            lbipam.cilium.io/sharing-key: gateway-vip
            lbipam.cilium.io/sharing-cross-namespace: gateway,code
        allowedCIDRs:
          - 10.0.0.0/8
          - 192.168.2.0/24
        storage:
          create: true
          size: 1Ti
          storageClass: 'local-zfs'
          volumeName: smbd
          accessMode: ReadWriteMany
    path: charts/smbd
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
