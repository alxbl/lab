# Dataset data/k8s/immich-db, claimed by media/immich-database-1 (CNPG instance PVC).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-db
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-zfs
  volumeMode: Filesystem
  local:
    path: /var/data/k8s/immich-db
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - tachyon.lan
  claimRef:
    namespace: media
    name: immich-database-1
