# Matter controller for Home Assistant. Host network: Matter uses LAN IPv6 link-local and mDNS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter-server
  labels:
    app.kubernetes.io/name: matter-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: matter-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matter-server
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: tachyon.lan
      containers:
      - name: matter-server
        image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
        args:
        - --storage-path=/data
        - --paa-root-cert-dir=/data/credentials
        - --primary-interface=eno1
        ports:
        - name: ws
          containerPort: 5580
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: matter-server
