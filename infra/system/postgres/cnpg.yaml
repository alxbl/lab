# openebs/openebs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  project: system
  source: 
    chart: cnpg/cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: HEAD
    # helm:
    #   valuesObject:
    #     key: value
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cnpg-system